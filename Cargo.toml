[package]
name = "rutabaga"
version = "0.1.0"
edition = "2021"

[dependencies]
bitcoin = { version = "0.32", features = ["rand-std"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "wallet"
